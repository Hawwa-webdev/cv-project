    <!DOCTYPE html>
    <html lang="fr">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>formulaire d'un cv</title>
            <link rel="stylesheet" href="form.css">
        </head>
        <body>
            <div class="container">
            
                <form id="form-cv">

                    <div class="formCV">
                        <label for="photo">Photo de CV</label>
                        <input type="file" id="photo" name="photo"> 
                    </div>

                    <div class="formCV">
                        <label for="NomPrenom">Prenom et nom</label>
                        <input type="text" id="NomPrenom" name="prenom" placeholder="Votre prenom et nom">
                    </div>
                    
                    <div class="formCV">
                        <label for="Titre">Titre</label>
                        <input type="text" id="Titre" name="Titre" placeholder="Votre titre professionnel">
                    </div>

                    <div class="formCV">
                        <label for="tel">Numero de telephone</label>
                        <input type="tel" id="Telephone" name="tel" placeholder="Votre numero de telephone">
                    </div>

                    <div class="formCV">
                        <label for="Email">Email</label>
                        <input type="Email" id="Email" name="Email" placeholder="exemple@gmail.com">
                    </div>

                    <div class="formCV">
                        <label for="addresse">Addresse</label>
                        <input type="text" id="Addresse" name="addresse" placeholder="Votre addresse">
                    </div>

                    <div class="formCV">
                        <label for="description">Description</label>
                        <textarea id="Description" name="description" rows="4" placeholder="Parlez de vous"></textarea>
                    </div>

                    <div class="formCV">
                        <label for="formations">Formation</label>
                        <textarea id="Formations" name="formations" rows="4" placeholder="Vos etudes et diplomes"></textarea>
                    </div>

                    <div class="formCV">
                        <label for="competences">Competences</label>
                        <textarea id="competences" name="competences" rows="3" placeholder="html,css,Js"></textarea>
                    </div>

                    <div class="formCV">
                        <label for="Experiences">Experiences</label>
                        <textarea id="Experiences" name="Experiences"rows="4" placeholder="Vos experiences professionnelles"></textarea>
                    </div>

                    <div class="formCV">
                        <label for="Langues">Langues</label>
                        <textarea id="Langues" name="langues"rows="3" placeholder="Anglais,français,..."></textarea>
                    </div>

                        <button id="" type="submit">créer mon CV</button>
               </form>
            </div>
        </body>
    </html>
